<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: sans-serif;
        }
        button{
            height: max-content;
            padding: 5px 25px;
            border-radius: 100px;
            border: none;
            background-color: blue;
            color: #fff;
        }

        h2{
            color: #48ff00;
        }
        .img{
            width: 100%;
            height: 200px;
            background-image: url("tovar1.jpg");
        }
        .card{
            max-width: 300px;
            box-shadow: 0 0 4px 2px #00000025;
            padding: 15px;
            border-radius: 10px;
        }
        .price{
            align-items: center;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="img"></div>
        <h3 class="title">Название товара</h3>
        <div class="price">
            <h2>3 499 P</h2>
            <button>Купить</button>

        </div>
    </div>
</body>
</html>
